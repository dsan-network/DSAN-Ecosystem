name: architecture-terminology-conformance

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'references/**'
      - 'tests/test_dse_terminology.py'
      - '.github/workflows/architecture-terminology.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'references/**'
      - 'tests/test_dse_terminology.py'
      - '.github/workflows/architecture-terminology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-terminology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check DSE canonical usage and retained historical alias
        run: python -m unittest discover -s tests -p 'test_dse_terminology.py' -v
